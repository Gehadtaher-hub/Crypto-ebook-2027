/* Quizzes dropdown and embedded exam */
.quiz-menu{position:relative}
.quiz-toggle{display:flex;align-items:center;gap:7px;cursor:pointer;font:inherit}
.quiz-toggle::after{content:'▾';font-size:12px;transition:transform .2s ease}

pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const file='crypto_ebook.pdf',root=document.getElementById('book'),viewer=document.querySelector('.viewer'),loading=document.getElementById('loading'),statusEl=document.getElementById('status'),pageNo=document.getElementById('pageNo'),prev=document.getElementById('prev'),next=document.getElementById('next');let doc,total=0,flip,pageRatio=.75;
function fit(){const mw=Math.max(240,viewer.clientWidth-20),mh=Math.max(280,viewer.clientHeight-16);let h=mh,w=h*pageRatio;if(w>mw){w=mw;h=w/pageRatio}return{w:Math.floor(w),h:Math.floor(h)}}
async function links(pg,d,vp){const layer=document.createElement('div');layer.className='link-layer';d.appendChild(layer);for(const a of (await pg.getAnnotations()).filter(x=>x.subtype==='Link')){const r=vp.convertToViewportRectangle(a.rect),l=Math.min(r[0],r[2]),t=Math.min(r[1],r[3]),w=Math.abs(r[2]-r[0]),h=Math.abs(r[3]-r[1]),el=document.createElement('a');el.className='pdf-link';el.style.cssText=`left:${l/vp.width*100}%;top:${t/vp.height*100}%;width:${w/vp.width*100}%;height:${h/vp.height*100}%`;if(a.url){el.href=a.url;el.target='_blank'}layer.appendChild(el)}}
(async()=>{try{doc=await pdfjsLib.getDocument(file).promise;total=doc.numPages;pageNo.max=total;const first=await doc.getPage(1),b=first.getViewport({scale:1});pageRatio=b.width/b.height;const z=fit(),scale=Math.max(1.4,z.w/b.width*(devicePixelRatio||1));root.style.width=z.w+'px';root.style.height=z.h+'px';for(let n=1;n<=total;n++){statusEl.textContent=`Preparing page ${n} of ${total}`;const pg=await doc.getPage(n),vp=pg.getViewport({scale}),c=document.createElement('canvas'),d=document.createElement('div');c.width=Math.ceil(vp.width);c.height=Math.ceil(vp.height);d.className='page';d.appendChild(c);await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;await links(pg,d,vp);root.appendChild(d)}loading.style.display='none';root.style.display='block';flip=new St.PageFlip(root,{width:z.w,height:z.h,size:'fixed',showCover:false,usePortrait:true,mobileScrollSupport:false,drawShadow:true,flippingTime:650,maxShadowOpacity:.35});flip.loadFromHTML(root.querySelectorAll('.page'));flip.on('flip',e=>{pageNo.value=e.data+1;statusEl.textContent=`Page ${e.data+1} of ${total}`;prev.disabled=e.data===0;next.disabled=e.data===total-1});pageNo.disabled=false;next.disabled=false;statusEl.textContent=`Page 1 of ${total}`}catch(e){loading.innerHTML=`<h2>Viewer failed</h2><p>Keep <b>${file}</b> beside this HTML file.</p><small>${e.message}</small>`}})();prev.onclick=()=>flip&&flip.flipPrev();next.onclick=()=>flip&&flip.flipNext();pageNo.onchange=()=>flip&&flip.flip(Math.max(1,Math.min(total,+pageNo.value||1))-1);let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>location.reload(),300)});
</script>
<script>
(()=>{
  const menu=document.getElementById('quizMenu'),toggle=document.getElementById('quizToggle'),overlay=document.getElementById('quizOverlay'),frame=document.getElementById('quizFrame'),closeBtn=document.getElementById('quizClose');
  function setMenu(open){menu.classList.toggle('open',open);toggle.setAttribute('aria-expanded',String(open))}
  function openQuiz(url){setMenu(false);frame.src=url;overlay.classList.add('open');overlay.setAttribute('aria-hidden','false');document.body.classList.add('quiz-open');closeBtn.focus()}
  function closeQuiz(){overlay.classList.remove('open');overlay.setAttribute('aria-hidden','true');document.body.classList.remove('quiz-open');frame.src='about:blank';toggle.focus()}
  toggle.addEventListener('click',e=>{e.stopPropagation();setMenu(!menu.classList.contains('open'))});
  document.querySelectorAll('.quiz-item').forEach(item=>item.addEventListener('click',()=>openQuiz(item.dataset.quizUrl)));
  closeBtn.addEventListener('click',closeQuiz);
  overlay.addEventListener('click',e=>{if(e.target===overlay)closeQuiz()});
  document.addEventListener('click',e=>{if(!menu.contains(e.target))setMenu(false)});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(overlay.classList.contains('open'))closeQuiz();else setMenu(false)}});
})();
</script>
